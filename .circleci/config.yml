version: 2.1

jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - run:
          name: Install AWS CLI
          command: |
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            sudo ./aws/install

      - run:
          name: Verify AWS identity
          command: |
            aws sts get-caller-identity

      - run:
          name: Login to Amazon ECR
          command: |
            aws ecr get-login-password --region us-east-2 |
              docker login \
                --username AWS \
                --password-stdin \
                806997204926.dkr.ecr.us-east-2.amazonaws.com

      - run:
          name: Build backend image
          command: |
            docker build \
              -t 806997204926.dkr.ecr.us-east-2.amazonaws.com/todo-backend:${CIRCLE_SHA1} \
              app/backend

      - run:
          name: Build frontend image
          command: |
            docker build \
              -t 806997204926.dkr.ecr.us-east-2.amazonaws.com/todo-frontend:${CIRCLE_SHA1} \
              app/frontend

      - run:
          name: Push backend image
          command: |
            docker push \
              806997204926.dkr.ecr.us-east-2.amazonaws.com/todo-backend:${CIRCLE_SHA1}

      - run:
          name: Push frontend image
          command: |
            docker push \
              806997204926.dkr.ecr.us-east-2.amazonaws.com/todo-frontend:${CIRCLE_SHA1}

workflows:
  ci:
    jobs:
      - build-and-push
