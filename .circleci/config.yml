version: 2.1

jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout

      - run:
          name: Verify AWS identity
          command: |
            aws --version
            aws sts get-caller-identity

      - run:
          name: Login to Amazon ECR
          command: |
            aws ecr get-login-password --region us-east-2 |
              docker login \
                --username AWS \
                --password-stdin \
                806997204926.dkr.ecr.us-east-2.amazonaws.com

      - run:
          name: Build backend image
          command: |
            docker build \
              -t 806997204926.dkr.ecr.us-east-2.amazonaws.com/todo-backend:${CIRCLE_SHA1} \
              app/backend

      - run:
          name: Build frontend image
          command: |
            docker build \
              -t 806997204926.dkr.ecr.us-east-2.amazonaws.com/todo-frontend:${CIRCLE_SHA1} \
              app/frontend

      - run:
          name: Push backend image
          command: |
            docker push \
              806997204926.dkr.ecr.us-east-2.amazonaws.com/todo-backend:${CIRCLE_SHA1}

      - run:
          name: Push frontend image
          command: |
            docker push \
              806997204926.dkr.ecr.us-east-2.amazonaws.com/todo-frontend:${CIRCLE_SHA1}

      - run:
          name: Update GitOps manifests
          command: |
            sed -i "s|todo-backend:.*|todo-backend:${CIRCLE_SHA1}|" kubernetes/backend.yaml
            sed -i "s|todo-frontend:.*|todo-frontend:${CIRCLE_SHA1}|" kubernetes/frontend.yaml

            echo "Updated image references:"
            grep "image:" kubernetes/backend.yaml
            grep "image:" kubernetes/frontend.yaml

      - run:
          name: Commit and push GitOps changes
          command: |
            git config user.name "circleci"
            git config user.email "circleci@users.noreply.github.com"

            git remote set-url origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/iampratik11/todo-eks-gitops.git"

            git add kubernetes/backend.yaml kubernetes/frontend.yaml

            git commit \
              -m "Update application images to ${CIRCLE_SHA1}"

            git push origin master

workflows:
  ci:
    jobs:
      - build-and-push
